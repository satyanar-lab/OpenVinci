[project]
name = "openvinci-backend"
version = "0.1.0"
description = "OpenVinci backend — FastAPI wrapper around vendor/as generators"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",  # FastAPI uploads via /api/import/dbc
    "cantools>=39",
    # vendor/as code generators import these at run time
    # (see vendor/as/tools/generator/*.py).
    "scons>=4.5",
    "pycrc>=0.9",
    "bitarray>=2",
    "ply>=3.11",
    "Jinja2>=3",
    "autosar>=0.4",
]

[project.scripts]
openvinci-import-dbc = "importer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # starlette.testclient (used by fastapi.TestClient) wants httpx2.
    # Without it we get a StarletteDeprecationWarning on every test run.
    "httpx2>=2.3",
    "jsonschema>=4.21",
]
# `pip install -e backend[desktop]` — for the `python -m desktop.app`
# launcher. Held in a separate extra because pywebview pulls in a
# native GUI backend (GTK on Linux, WebKit2GTK on most distros, Cocoa
# on macOS, WebView2 on Windows) that headless server installs don't
# need.
desktop = [
    "pywebview>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "engine*", "gen*", "importer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
