[project]
name = "openvinci-backend"
version = "0.1.0"
description = "OpenVinci backend — FastAPI wrapper around vendor/as generators"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",  # FastAPI uploads via /api/import/dbc
    "cantools>=39",
    # vendor/as code generators import these at run time
    # (see vendor/as/tools/generator/*.py).
    "scons>=4.5",
    "pycrc>=0.9",
    "bitarray>=2",
    "ply>=3.11",
    "Jinja2>=3",
    "autosar>=0.4",
]

[project.scripts]
openvinci-import-dbc = "importer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # starlette.testclient (used by fastapi.TestClient) wants httpx2.
    # Without it we get a StarletteDeprecationWarning on every test run.
    "httpx2>=2.3",
    "jsonschema>=4.21",
]
# `pip install -e backend[desktop]` — for the `python -m desktop.app`
# launcher. Held in a separate extra because pywebview pulls in a
# native GUI backend (GTK on Linux, WebKit2GTK on most distros, Cocoa
# on macOS, WebView2 on Windows) that headless server installs don't
# need.
desktop = [
    "pywebview>=5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "engine*", "gen*", "importer*"]

# The H7 firmware-export generator (backend/gen/project_export.py)
# ships a vendored copy of the fixed template assets at
# backend/gen/h7_template/ — driver / board / linker / Makefile
# template plus a trimmed CMSIS subset. These are NOT Python; we
# enumerate them as package_data so `pip install -e backend`, the
# Docker image, and the PyInstaller desktop bundle all have them at
# runtime. Per the isolation contract in
# backend/tests/test_isolation.py, the dev-time canonical source
# tree they mirror is NOT shipped in any of those install targets.
[tool.setuptools.package-data]
gen = [
    "h7_template/Makefile.export",
    "h7_template/src/*.c",
    "h7_template/include/*.h",
    "h7_template/linker/*.ld",
    "h7_template/third_party/cmsis-device-h7/Include/*.h",
    "h7_template/third_party/cmsis-device-h7/Source/Templates/*.c",
    "h7_template/third_party/cmsis-device-h7/Source/Templates/gcc/*.s",
    "h7_template/third_party/CMSIS_5/CMSIS/Core/Include/*.h",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
