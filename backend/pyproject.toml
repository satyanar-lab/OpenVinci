[project]
name = "openvinci-backend"
version = "0.1.0"
description = "OpenVinci backend — FastAPI wrapper around vendor/as generators"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # vendor/as code generators import these at run time
    # (see vendor/as/tools/generator/*.py).
    "scons>=4.5",
    "pycrc>=0.9",
    "bitarray>=2",
    "ply>=3.11",
    "Jinja2>=3",
    "autosar>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
