name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out OpenVinci (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
        # vendor/as upstream registers `app/platform/qemu` as a gitlink
        # without a URL in any .gitmodules, so the recursive descent
        # exits non-zero. Top-level OpenVinci files + vendor/as itself
        # are still checked out by this point; `continue-on-error`
        # lets us fall through to the explicit-init fallback below.
        continue-on-error: true

      - name: Ensure vendor/as is initialized (fallback for upstream qemu gap)
        run: |
          if [ ! -d vendor/as/infras ]; then
            git submodule update --init vendor/as
          fi
          # Hard fail if vendor/as is still missing — every level beyond
          # Layer 1 schema unit tests needs it. The verify.sh guard catches
          # the local case; this catches CI.
          test -d vendor/as/infras

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show toolchain versions
        run: |
          python --version
          gcc --version | head -n 1
          g++ --version | head -n 1
          node --version
          npm --version

      - name: Install backend (venv + editable + dev deps)
        run: |
          python -m venv backend/.venv
          # Bypass an inherited PYTHONPATH if any (matches Makefile).
          PYTHONPATH= backend/.venv/bin/pip install --upgrade pip
          PYTHONPATH= backend/.venv/bin/pip install -e "backend[dev]"

      - name: Install frontend
        run: |
          cd frontend
          npm ci

      - name: Run verification (all levels)
        # OPENVINCI_RUN_FUNCTIONAL=1 is the gate the L2 fixtures
        # (broker + node) use. scripts/verify.sh also exports it
        # per-pytest invocation, but we set it at the step level so
        # the workflow file makes the opt-in visible without having
        # to read the shell script.
        env:
          OPENVINCI_RUN_FUNCTIONAL: "1"
        run: scripts/verify.sh

      - name: Upload verification logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openvinci-verify-logs
          path: build/verify/
          if-no-files-found: ignore
