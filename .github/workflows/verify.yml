name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out OpenVinci (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
        # vendor/as upstream registers `app/platform/qemu` as a gitlink
        # without a URL in any .gitmodules, so the recursive descent
        # exits non-zero. Top-level OpenVinci files + vendor/as itself
        # are still checked out by this point; `continue-on-error`
        # lets us fall through to the explicit-init fallback below.
        continue-on-error: true

      - name: Ensure vendor/as is initialized (fallback for upstream qemu gap)
        run: |
          if [ ! -d vendor/as/infras ]; then
            git submodule update --init vendor/as
          fi
          # Hard fail if vendor/as is still missing — every level beyond
          # Layer 1 schema unit tests needs it. The verify.sh guard catches
          # the local case; this catches CI.
          test -d vendor/as/infras

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show toolchain versions
        run: |
          python --version
          gcc --version | head -n 1
          g++ --version | head -n 1
          node --version
          npm --version

      - name: Install backend (venv + editable + dev deps)
        run: |
          python -m venv backend/.venv
          # Bypass an inherited PYTHONPATH if any (matches Makefile).
          PYTHONPATH= backend/.venv/bin/pip install --upgrade pip
          PYTHONPATH= backend/.venv/bin/pip install -e "backend[dev]"

      - name: Install frontend
        run: |
          cd frontend
          npm ci

      - name: Run verification (all levels)
        # OPENVINCI_RUN_FUNCTIONAL=1 is the gate the L2 fixtures
        # (broker + node) use. scripts/verify.sh also exports it
        # per-pytest invocation, but we set it at the step level so
        # the workflow file makes the opt-in visible without having
        # to read the shell script.
        env:
          OPENVINCI_RUN_FUNCTIONAL: "1"
        run: scripts/verify.sh

      - name: Upload verification logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openvinci-verify-logs
          path: build/verify/
          if-no-files-found: ignore

  # Separate job: proves the toolchain really travels with the image.
  # The Docker build copies vendor/as straight from the context and
  # bundles the gcc + generator pair the local `make verify` runs
  # against. We then run L1 generate+compile INSIDE the container —
  # the most representative single signal that the toolchain in the
  # image works end-to-end. Failures here mean the Dockerfile drifted
  # from the host build, not that the engine is broken.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out OpenVinci (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
        # Same upstream qemu gap as above; fall through and init
        # vendor/as explicitly.
        continue-on-error: true

      - name: Ensure vendor/as is initialized
        run: |
          if [ ! -d vendor/as/infras ]; then
            git submodule update --init vendor/as
          fi
          test -d vendor/as/infras

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: openvinci:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run L1 generate+compile inside the image
        # If the toolchain is missing, the wrong gcc is used, or
        # vendor/as didn't make it into the layers, this step fails.
        run: |
          docker run --rm openvinci:ci \
            pytest -q backend/tests/test_gen_pipeline.py

      - name: Smoke-test the HTTP surface
        # Start the container with the default entrypoint (uvicorn on
        # 8000), poll /health, hit /api/projects, then stop. Proves the
        # SPA-serving single-process flow works from a clean image.
        run: |
          docker run --rm -d --name openvinci-smoke \
            -p 18000:8000 openvinci:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18000/health
          curl -sf http://127.0.0.1:18000/api/projects | grep -q '"projects"'
          curl -sf http://127.0.0.1:18000/ | grep -qi '<!doctype html>'
          docker stop openvinci-smoke
