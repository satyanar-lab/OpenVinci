name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out OpenVinci (without submodules — done manually next)
        uses: actions/checkout@v4

      - name: Init vendor/as only (skip its broken nested submodules)
        # vendor/as itself declares a nested `app/platform/qemu` submodule
        # with no URL in its own .gitmodules, which trips both
        # `submodules: true` and `recursive` in actions/checkout. We only
        # need vendor/as itself, so init it explicitly without recursion.
        run: git submodule update --init vendor/as

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show toolchain versions
        run: |
          python --version
          gcc --version | head -n 1
          g++ --version | head -n 1
          node --version
          npm --version

      - name: Install backend (venv + editable + dev deps)
        run: |
          python -m venv backend/.venv
          # Bypass an inherited PYTHONPATH if any (matches Makefile).
          PYTHONPATH= backend/.venv/bin/pip install --upgrade pip
          PYTHONPATH= backend/.venv/bin/pip install -e "backend[dev]"

      - name: Install frontend
        run: |
          cd frontend
          npm ci

      - name: Run verification (all levels)
        run: scripts/verify.sh

      - name: Upload verification logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openvinci-verify-logs
          path: build/verify/
          if-no-files-found: ignore
